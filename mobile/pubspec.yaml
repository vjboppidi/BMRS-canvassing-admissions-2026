name: bmrs_admissions
description: "BMRS canvassing admissions — teacher mobile app (offline-first lead capture + reminders)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking + state
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1

  # Local storage
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Connectivity + sync
  connectivity_plus: ^6.1.0

  # Notifications (FCM is stubbed behind this interface for now)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Misc
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
